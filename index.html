<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="referrer" content="no-referrer-when-downgrade" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#8b5cf6" />

  <!-- Cache Control (Critical for SPA updates) -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <title>Business Manager</title>

  <link rel="icon" type="image/svg+xml" href="./vite.svg" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./vite.svg">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;500;600&family=Roboto:wght@300;400;500&family=Space+Mono:wght@400;700&family=Noto+Serif+Devanagari:wght@400;700&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --primary-color: 139 92 246;
      /* Default Violet */
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      background-color: #f8fafc;
    }

    .dark body {
      background-color: #0f172a;
    }
  </style>

  <script>
    // Capture PWA install prompt early
    window.deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      window.deferredPrompt = e;
      console.log('Capture install prompt');
    });
  </script>

  <script>
    // IMMEDIATE THEME & COLOR SETUP
    (function () {
      try {
        // 1. Handle Dark Mode (Simplified)
        var localTheme = localStorage.getItem('theme');
        var supportDarkMode = window.matchMedia('(prefers-color-scheme: dark)').matches === true;

        // Only set dark mode initially to avoid white flash
        if (localTheme === 'dark' || (!localTheme && supportDarkMode)) {
          document.documentElement.classList.add('dark');
        } else {
          // If manual light mode or system light, ensure clean slate
          document.documentElement.classList.remove('dark');
        }

        // 2. Handle Custom Theme Color
        var savedColor = localStorage.getItem('themeColor');
        if (savedColor) {
          var r = parseInt(savedColor.slice(1, 3), 16);
          var g = parseInt(savedColor.slice(3, 5), 16);
          var b = parseInt(savedColor.slice(5, 7), 16);
          document.documentElement.style.setProperty('--primary-color', r + ' ' + g + ' ' + b);

          // Meta theme color update
          var metaTheme = document.querySelector("meta[name='theme-color']");
          if (metaTheme) metaTheme.content = savedColor;
        }

      } catch (e) {
        console.error("Theme setup error", e);
      }
    })();
  </script>

  <!-- Drag and Drop Polyfill for Mobile -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mobile-drag-drop@2.3.0-rc.2/default.css">
  <script src="https://cdn.jsdelivr.net/npm/mobile-drag-drop@2.3.0-rc.2/index.min.js"></script>
  <script>
    // Init Polyfill
    var iOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    MobileDragDrop.polyfill({
      dragImageOffset: { x: 0, y: 0 },
      dragImageCenterOnTouch: true,
      iterationIntervalMs: 50,
      holdToDrag: iOS ? 300 : 150 // Hold for a moment to drag on mobile
    });
  </script>
</head>

<body
  class="bg-background dark:bg-slate-900 text-text dark:text-slate-300 antialiased selection:bg-primary selection:text-white">
  <div id="root">
    <div id="initial-loader"
      class="fixed inset-0 z-[9999] flex flex-col items-center justify-center animate-fade-in cursor-wait bg-[#f8fafc] dark:bg-[#020617]">
      <style>
        @keyframes devine-pulse {
          0% {
            transform: scale(0.9);
            opacity: 0.8;
            text-shadow: 0 0 20px rgb(var(--primary-color) / 0.5);
          }

          50% {
            transform: scale(1.1);
            opacity: 1;
            text-shadow:
              0 0 30px rgb(var(--primary-color) / 0.8),
              0 0 60px rgb(var(--primary-color) / 0.6),
              0 0 90px rgb(var(--primary-color) / 0.4);
          }

          100% {
            transform: scale(0.9);
            opacity: 0.8;
            text-shadow: 0 0 20px rgb(var(--primary-color) / 0.5);
          }
        }

        .animate-devine-pulse {
          animation: devine-pulse 4s ease-in-out infinite;
        }

        @keyframes fade-in {
          from {
            opacity: 0;
          }

          to {
            opacity: 1;
          }
        }

        .animate-fade-in {
          animation: fade-in 0.5s ease-out forwards;
        }

        @keyframes pulse {

          0%,
          100% {
            opacity: 1;
          }

          50% {
            opacity: 0.5;
          }
        }

        .animate-pulse {
          animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes progress-indeterminate {
          0% {
            transform: translateX(-100%);
          }

          50% {
            transform: translateX(0%);
          }

          100% {
            transform: translateX(100%);
          }
        }

        .animate-progress-indeterminate {
          animation: progress-indeterminate 1.5s infinite ease-in-out;
        }

        @keyframes dot-bounce {

          0%,
          100% {
            opacity: 0.2;
            transform: translateY(0);
          }

          50% {
            opacity: 1;
            transform: translateY(-4px);
          }
        }

        .animate-dot-1 {
          animation: dot-bounce 1.4s infinite both;
          animation-delay: 0s;
        }

        .animate-dot-2 {
          animation: dot-bounce 1.4s infinite both;
          animation-delay: 0.2s;
        }

        .animate-dot-3 {
          animation: dot-bounce 1.4s infinite both;
          animation-delay: 0.4s;
        }
      </style>

      <div class="relative flex items-center justify-center mb-8">
        <!-- Subtle background ambiance -->
        <div class="absolute inset-0 blur-[100px] rounded-full animate-pulse"
          style="background-color: rgb(var(--primary-color) / 0.05);"></div>

        <!-- The Symbol -->
        <div class="animate-devine-pulse relative z-10 text-[200px] leading-none font-serif font-bold select-none"
          style="color: rgb(var(--primary-color));">
          ॐ
        </div>
      </div>

      <!-- Loading Indicators -->
      <div class="flex flex-col items-center gap-4 z-10 w-64">
        <div class="text-lg font-bold tracking-widest uppercase flex items-end leading-none h-6"
          style="color: rgb(var(--primary-color) / 0.8);">
          LOADING
          <div class="flex ml-1 mb-1">
            <span class="animate-dot-1 mx-[1px]">.</span>
            <span class="animate-dot-2 mx-[1px]">.</span>
            <span class="animate-dot-3 mx-[1px]">.</span>
          </div>
        </div>

        <!-- Progress Bar -->
        <div class="w-full h-1.5 rounded-full overflow-hidden bg-gray-200/50 dark:bg-slate-800/50">
          <div class="h-full w-full origin-left animate-progress-indeterminate"
            style="background: linear-gradient(to right, rgb(var(--primary-color) / 0.4), rgb(var(--primary-color)));">
          </div>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="./index.tsx"></script>
</body>

</html>
